<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" role="img" aria-label="divisor">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8703f" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#b8703f"/>
      <stop offset="0.55" stop-color="#3fa9ff"/>
      <stop offset="1" stop-color="#3fa9ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .p { animation: p 3s ease-in-out infinite; }
      @keyframes p { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
    </style>
  </defs>
  <rect x="0" y="17" width="1200" height="2" fill="url(#l)" class="p"/>
  <!-- espada deitada -->
  <g transform="translate(540 12)" filter="url(#g)">
    <rect x="-6"  y="2" width="7"   height="8"  rx="3" fill="#a3602f"/>
    <rect x="0"   y="4" width="18"  height="4"  fill="#7a4220"/>
    <rect x="6"   y="4" width="1"   height="4"  fill="#55290f"/>
    <rect x="12"  y="4" width="1"   height="4"  fill="#55290f"/>
    <rect x="18"  y="-1" width="5"  height="14" fill="#a3602f"/>
    <rect x="23"  y="2" width="88"  height="8"  fill="#a3602f"/>
    <rect x="23"  y="2" width="88"  height="2"  fill="#c98a5a"/>
    <rect x="23"  y="8" width="88"  height="2"  fill="#7a4220"/>
    <rect x="111" y="4" width="6"   height="4"  fill="#b8703f"/>
  </g>
</svg>
